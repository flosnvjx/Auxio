name: Android CI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # Only tags with semver prefix like v1.2.3, v1.2.3-beta, etc.
    branches: [ '**' ]
  pull_request:
    branches: []

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build

    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clone submodules
      run: |
        git submodule update --init --recursive --remote
        env -C media/ git checkout fa25fffca29c5ce6f203fd730d312301f2f95a97

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check formatting with spotless
      run: |
        if ! ./gradlew spotlessCheck; then
          ./gradlew :spotlessApply
          git diff | cat
          ./gradlew spotlessCheck
        fi

    - name: Test musikr with Gradle
      run: ./gradlew musikr:testDebug

    - name: Build release APK with Gradle
      id: build
      run: ./gradlew app:assembleRelease
      continue-on-error: true

    - name: Upload Gradle reports (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Gradle-reports
        path: build/reports/

    - name: Upload release APK artifact (on success)
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Release
        path: ./app/build/outputs/apk/release/app-release.apk

    - name: Fail the job if build failed
      if: steps.build.outcome == 'failure'
      run: exit 1

    - name: Create GitHub Release (only for semver tags)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.build.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: |
          Automated pre-release build for tag ${{ github.ref_name }}.
        prerelease: true
        files: ./app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
